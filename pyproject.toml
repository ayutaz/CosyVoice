[project]
name = "cosyvoice"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    "conformer==0.3.2",
    "deepspeed==0.15.1; sys_platform == 'linux'",
    "diffusers==0.29.0",
    "fastapi==0.115.6",
    "fastapi-cli==0.0.4",
    "gdown==5.1.0",
    "gradio==5.4.0",
    "grpcio==1.57.0",
    "grpcio-tools==1.57.0",
    "hydra-core==1.3.2",
    "hyperpyyaml==1.2.3",
    "inflect==7.3.1",
    "librosa==0.10.2",
    "lightning==2.2.4",
    "matplotlib==3.7.5",
    "modelscope==1.20.0",
    "networkx==3.1",
    "numpy==1.26.4",
    "omegaconf==2.3.0",
    "onnx==1.16.0",
    "onnxruntime-gpu==1.18.0; sys_platform == 'linux'",
    "onnxruntime==1.18.0; sys_platform == 'darwin' or sys_platform == 'win32'",
    "openai-whisper==20231117",
    "protobuf==4.25",
    "pyarrow==18.1.0",
    "pydantic==2.7.0",
    "pyopenjtalk==0.4.1",
    "pyworld==0.3.4",
    "regex>=2026.6.28",
    "rich==13.7.1",
    "soundfile==0.12.1",
    "tensorboard==2.14.0",
    "tensorrt-cu12==10.13.3.9; sys_platform == 'linux'",
    "tensorrt-cu12-bindings==10.13.3.9; sys_platform == 'linux'",
    "tensorrt-cu12-libs==10.13.3.9; sys_platform == 'linux'",
    "torch==2.3.1",
    "torchaudio==2.3.1",
    "transformers==4.51.3",
    "uvicorn==0.30.0",
    "wetext==0.0.4",
    "wget==3.2",
    "x-transformers==2.11.24",
]

# NOTE vastai CLI conflicts with gradio/matplotlib pillow pins, run it isolated via `uvx vastai`
[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu121", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu121", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
onnxruntime-gpu = [{ index = "onnxruntime-cuda-12", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

# https://github.com/microsoft/onnxruntime/issues/21684
[[tool.uv.index]]
name = "onnxruntime-cuda-12"
url = "https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/onnxruntime-cuda-12/pypi/simple/"
explicit = true

# NOTE openai-whisper 20231117 setup.py needs pkg_resources, removed in setuptools>=81
[tool.uv.extra-build-dependencies]
openai-whisper = ["setuptools<81"]

# NOTE static metadata so uv lock does not need to build these linux-only sdists
[[tool.uv.dependency-metadata]]
name = "deepspeed"
version = "0.15.1"
requires-dist = ["hjson", "msgpack", "ninja", "numpy", "nvidia-ml-py", "packaging>=20.0", "psutil", "py-cpuinfo", "pydantic", "torch", "tqdm"]

[[tool.uv.dependency-metadata]]
name = "tensorrt-cu12"
version = "10.13.3.9"
requires-dist = ["tensorrt-cu12-bindings==10.13.3.9", "tensorrt-cu12-libs==10.13.3.9"]
